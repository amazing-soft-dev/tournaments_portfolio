name: Merge passing pull request

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const pull = pulls.find((item) => item.head.sha === sha);
            if (!pull) {
              core.info(`No open pull request for ${sha}`);
              return;
            }
            const head = pull.head.ref;
            const base = pull.base.ref;
            const feature = /^(feat|fix|docs|ci|build)\//.test(head) && base === "dev";
            const release = head === "dev" && base === "main";
            if (!feature && !release) {
              core.info(`Leaving ${head} -> ${base}`);
              return;
            }
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              merge_method: "merge",
              sha,
            });
            core.info(`Merged pull request #${pull.number}`);
