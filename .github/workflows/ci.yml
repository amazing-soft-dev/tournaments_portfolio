name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:images

  build-server:
    name: Build (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  build-static:
    name: Build (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:static
        env:
          NEXT_OUTPUT: export

  ci-passed:
    name: CI passed
    needs: [lint, build-server, build-static]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the other jobs
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.build-server.result }}" = "success"
          test "${{ needs.build-static.result }}" = "success"
      - name: Summarize the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const lint = "${{ needs.lint.result }}";
            const server = "${{ needs.build-server.result }}";
            const staticBuild = "${{ needs.build-static.result }}";
            const ok = lint === "success" && server === "success" && staticBuild === "success";
            const marker = "<!-- ci-summary -->";
            const body = [
              marker,
              ok ? "CI passed." : "CI failed.",
              "",
              `- Lint and type check: ${lint}`,
              `- Build (server): ${server}`,
              `- Build (static): ${staticBuild}`,
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
